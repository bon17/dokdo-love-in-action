<script>
'use strict';
const CLASSES = { 1: 6, 2: 5, 3: 6 };
const params = new URLSearchParams(location.search);
const URL_ = (params.get('url') || (window.DOKDO_CONFIG || {}).rankingUrl || '').trim();
let grade = +params.get('grade') || 0, cls = +params.get('cls') || 0, rows = null, err = '';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = s => { s = Math.round(s); const m = Math.floor(s / 60); return m ? `${m}분 ${s % 60}초` : `${s}초`; };
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();
function filters() {
  const f = $('filters'); f.innerHTML = '';
  const btn = (t, on, fn, small) => { const b = document.createElement('button'); b.className = 'f' + (on ? ' on' : '') + (small ? ' small' : ''); b.textContent = t; b.onclick = fn; f.append(b); };
  btn('전교', !grade, () => { grade = 0; cls = 0; draw(); });
  for (const g of [1, 2, 3]) btn(`${g}학년`, grade === g, () => { grade = g; cls = 0; draw(); });
  if (grade) {
    btn('학년 전체', !cls, () => { cls = 0; draw(); }, true);
    for (let c = 1; c <= CLASSES[grade]; c++) btn(`${c}반`, cls === c, () => { cls = c; draw(); }, true);
  }
}
function draw() {
  filters();
  const list = $('list');
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(URL_)) {
    list.innerHTML = '<div class="msg">랭킹 주소가 설정되지 않았어요.<br>저장소의 config.js 에 구글 앱스 스크립트 웹 앱 주소를 넣어 주세요.<br>(docs/teacher-guide.md 참고)</div>';
    $('info').textContent = '설정 필요'; return;
  }
  if (!rows) { list.innerHTML = `<div class="msg">${err ? '순위를 불러오지 못했어요. 다시 시도하는 중…' : '순위를 불러오는 중…'}</div>`; return; }
  const f = rows.filter(r => (!grade || r.g === grade) && (!cls || r.c === cls));
  if (!f.length) list.innerHTML = '<div class="msg">아직 기록이 없어요.<br>첫 번째 대원이 되어 보세요!</div>';
  else list.innerHTML = f.slice(0, 20).map((r, i) => `<div class="row ${i < 3 ? 'top' + (i + 1) : ''}">
      <div class="rk">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</div><div class="cl">${r.g}학년 ${r.c}반</div><div class="nm">${esc(r.n)}</div>
      <div class="sc">${Number(r.s).toLocaleString('ko-KR')}점</div><div class="gr">${esc(r.r)}</div><div class="tm">${fmtTime(r.t)}</div></div>`).join('');
  $('info').textContent = `참여 ${f.length}명 · 마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')}`;
}
async function load() {
  if (!URL_) return draw();
  try {
    const r = await fetch(URL_ + (URL_.includes('?') ? '&' : '?') + 'action=list&_=' + Date.now());
    const j = await r.json();
    if (j && j.ok) { rows = j.rows; err = ''; } else err = 'bad';
  } catch (e) { err = String(e); }
  draw();
}
draw(); load(); setInterval(load, 10000);
</script>
