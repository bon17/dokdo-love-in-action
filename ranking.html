<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독도 타임 패트롤 랭킹</title>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff" as="font" type="font/woff" crossorigin>
<script src="config.js"></script>
<style>
  @font-face{font-family:'RIDIBatang';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');font-display:swap}
  :root { --gold:#f2c14e; --orange:#ff8a3d; --ui:'RIDIBatang','Noto Serif KR',serif; }
  html,body { margin:0; height:100%; overflow:hidden; background:#061425; color:#fff; font-family:var(--ui); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;
    background:radial-gradient(circle at 20% 10%,#1d5a8f 0%,#0b2545 45%,#061425 100%); }
  header { position:absolute; left:60px; right:60px; top:36px; display:flex; align-items:flex-end; gap:30px; }
  .school { font-size:34px; color:#ffd9a8; }
  h1 { margin:0; font-size:76px; font-weight:400; text-shadow:0 4px 0 #0b2545,0 0 24px rgba(255,160,80,.5); }
  .filters { position:absolute; left:60px; top:190px; display:flex; gap:12px; flex-wrap:wrap; max-width:1400px; }
  .f { border:none; border-radius:16px; padding:10px 24px; font:30px var(--ui); background:rgba(255,255,255,.12); color:#fff; cursor:pointer; }
  .f.on { background:var(--orange); }
  .f.small { font-size:24px; padding:8px 18px; }
  #list { position:absolute; left:60px; top:300px; width:1380px; height:690px; display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(10,1fr); column-gap:30px; row-gap:10px; }
  .row { display:flex; align-items:center; gap:18px; padding:0 22px; border-radius:18px; background:rgba(255,255,255,.07); font-size:30px; animation:in .4s ease-out; }
  .row .rk { width:64px; text-align:center; font-size:38px; }
  .row .cl { width:150px; color:#bcd3ea; font-size:26px; }
  .row .nm { flex:1; font-size:34px; }
  .row .sc { color:var(--gold); font-size:36px; min-width:170px; text-align:right; }
  .row .gr { width:44px; text-align:center; font-size:30px; color:#ffd9a8; }
  .row .tm { width:150px; text-align:right; color:#bcd3ea; font-size:24px; }
  .row.top1 { background:linear-gradient(90deg,rgba(242,193,78,.45),rgba(242,193,78,.12)); }
  .row.top2 { background:linear-gradient(90deg,rgba(200,210,230,.38),rgba(200,210,230,.1)); }
  .row.top3 { background:linear-gradient(90deg,rgba(214,140,80,.4),rgba(214,140,80,.1)); }
  @keyframes in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  aside { position:absolute; right:60px; top:300px; width:380px; text-align:center; }
  aside img { width:340px; height:340px; background:#fff; border-radius:24px; padding:14px; }
  aside .u { font-size:24px; color:#cfe6ff; margin-top:12px; word-break:break-all; }
  aside .t { font-size:30px; margin-bottom:14px; }
  .box { background:rgba(255,255,255,.08); border-radius:22px; padding:22px; margin-top:26px; font-size:26px; line-height:1.6; color:#dfe9f5; }
  footer { position:absolute; left:60px; right:60px; bottom:26px; font-size:24px; color:#8fa7c0; display:flex; justify-content:space-between; }
  .msg { grid-column:1 / span 2; grid-row:1 / span 10; display:flex; align-items:center; justify-content:center; text-align:center; font-size:36px; line-height:1.7; color:#dfe9f5; }
</style>
</head>
<body>

  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <aside>
    <div class="t">📱 게임 참여하기</div>
    <img alt="게임 주소 QR 코드" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWgAAAFoCAIAAAD1h/aCAAAHw0lEQVR4nO3dS24cORBAQWvg+1/Zs5g9hceaNFmtiK2hrk+3H7hIkF9//vz5BVD8c/oGgPcRDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiATDiD7vf2XX19f/+N9HLe9heL2e1hfcej1XnjRJxY3/ORJF3/rZ/8fKw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4g258cXbvwLOvtmb/tKcMnLnyBR6ZO3zXMeuG3NvQCrTiATDiATDiATDiATDiATDiATDiATDiATDiAbGpydO1d44BrR+ZK17Z34nzitn063/W9PHHkWaw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gOzM5Ogn+fvH3J+66JFP3t7odOi0ev5jxQFkwgFkwgFkwgFkwgFkwgFkwgFkwgFkBsC+92QcaGhC6ZM24xsahDvyin4OKw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gOzM5+klbs21PKM7tXrd9Sxde9LaPfeKTfvZWHEAmHEAmHEAmHEAmHEAmHEAmHEAmHEAmHEA2NTn6STs+PhnxvO1U5A+76G0/s9vuZ44VB5AJB5AJB5AJB5AJB5AJB5AJB5AJB5AJB5DtT45+0gaKP8fcaOORg+O3Lzo0BftzWHEAmXAAmXAAmXAAmXAAmXAAmXAAmXAA2f4A2NyZyUNed8MLFx4rfWSkami07MLXu23oh23FAWTCAWTCAWTCAWTCAWTCAWTCAWTCAWTCAWRfQ4NlF56+u/2kF46cHpkyvPA7HfKu/xRHfoFWHEAmHEAmHEAmHEAmHEAmHEAmHEAmHEAmHEB2456jRzaSHJor3b7i68Y0b5ugfdcmsr8eHKB9ZLLZigPIhAPIhAPIhAPIhAPIhAPIhAPIhAPIprYO/OaqJ2axPuljbxtme+JdT3rh2N6RF2jFAWTCAWTCAWTCAWTCAWTCAWTCAWTCAWTCAWT7WweuPRmhO7J14MLQNohHZhCPjKsemad8ctGhZ3ndboYLVhxAJhxAJhxAJhxAJhxAJhxAJhxAJhxAJhxAdubQ6SPH5K4tbum2bS+fmHu3Q+c/D93whUOc7zpm3IoDyIQDyIQDyIQDyIQDyIQDyIQDyIQDyIQDyKb2HH3iyEnif3+U8MgQ55yhCdrt73Rop9i1CwdSh27JigPIhAPIhAPIhAPIhAPIhAPIhAPIhAPI9gfA5qathg5qPnLR7T88smXebTNy39o+HXr7WeZe4NCzDL0HKw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gEw4gm9o6cGjK8MgI3ZOd+G47knruBW5/7JE9/o7YfvkXzuxacQCZcACZcACZcACZcACZcACZcACZcACZcADZ15GzgrfNDXEOzSDetpHkJ73AtaEnnfvZv+uocCsOIBMOIBMOIBMOIBMOIBMOIBMOIBMOIBMOINufHP3mc0/MEV64A6XXe+dFjziypavT6oFbCAeQCQeQCQeQCQeQCQeQCQeQCQeQTW0duHZkEmbIhWNRR3a+23bhOdi3fewcA2DA3yMcQCYcQCYcQCYcQCYcQCYcQCYcQCYcQPZ76HOHZhDnDvX9+ze8vp/bznD+1uKG1xc9MiP7rtnQCwdSrTiATDiATDiATDiATDiATDiATDiATDiATDiAbGpydGhH0gs3Ot02NwW7PcT55KJH9ivd9kl7jh5581YcQCYcQCYcQCYcQCYcQCYcQCYcQCYcQCYcQHZmz9Ghwccn20wOnfA+9CzvGtO8bbfXub8dmg2dG5jeZsUBZMIBZMIBZMIBZMIBZMIBZMIBZMIBZFMDYE9sj6y8ayzqiaFhtrWh1/uu+bojJzxfyIoDyIQDyIQDyIQDyIQDyIQDyIQDyIQDyI     <div class="u">https://bon17.github.io/dokdo-love-in-action/</div>
    <div class="box">점수가 같으면 더 빨리 끝낸 대원이 앞서요.<br>다시 도전하면 최고 기록만 반영돼요.</div>
  </aside>
  <footer><span id="info">순위를 불러오는 중…</span><span>10초마다 자동으로 새로 고침</span></footer>
</div>
<script>
'use strict';
const CLASSES = { 1: 6, 2: 5, 3: 6 };
const params = new URLSearchParams(location.search);
const URL_ = (params.get('url') || (window.DOKDO_CONFIG || {}).rankingUrl || '').trim();
let grade = +params.get('grade') || 0, cls = +params.get('cls') || 0, rows = null, err = '';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = s => { s = Math.round(s); const m = Math.floor(s / 60); return m ? `${m}분 ${s % 60}초` : `${s}초`; };
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();
function filters() {
  const f = $('filters'); f.innerHTML = '';
  const btn = (t, on, fn, small) => { const b = document.createElement('button'); b.className = 'f' + (on ? ' on' : '') + (small ? ' small' : ''); b.textContent = t; b.onclick = fn; f.append(b); };
  btn('전교', !grade, () => { grade = 0; cls = 0; draw(); });
  for (const g of [1, 2, 3]) btn(`${g}학년`, grade === g, () => { grade = g; cls = 0; draw(); });
  if (grade) {
    btn('학년 전체', !cls, () => { cls = 0; draw(); }, true);
    for (let c = 1; c <= CLASSES[grade]; c++) btn(`${c}반`, cls === c, () => { cls = c; draw(); }, true);
  }
}
function draw() {
  filters();
  const list = $('list');
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(URL_)) {
    list.innerHTML = '<div class="msg">랭킹 주소가 설정되지 않았어요.<br>저장소의 config.js 에 구글 앱스 스크립트 웹 앱 주소를 넣어 주세요.<br>(docs/teacher-guide.md 참고)</div>';
    $('info').textContent = '설정 필요'; return;
  }
  if (!rows) { list.innerHTML = `<div class="msg">${err ? '순위를 불러오지 못했어요. 다시 시도하는 중…' : '순위를 불러오는 중…'}</div>`; return; }
  const f = rows.filter(r => (!grade || r.g === grade) && (!cls || r.c === cls));
  if (!f.length) list.innerHTML = '<div class="msg">아직 기록이 없어요.<br>첫 번째 대원이 되어 보세요!</div>';
  else list.innerHTML = f.slice(0, 20).map((r, i) => `<div class="row ${i < 3 ? 'top' + (i + 1) : ''}">
      <div class="rk">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</div><div class="cl">${r.g}학년 ${r.c}반</div><div class="nm">${esc(r.n)}</div>
      <div class="sc">${Number(r.s).toLocaleString('ko-KR')}점</div><div class="gr">${esc(r.r)}</div><div class="tm">${fmtTime(r.t)}</div></div>`).join('');
  $('info').textContent = `참여 ${f.length}명 · 마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')}`;
}
async function load() {
  if (!URL_) return draw();
  try {
    const r = await fetch(URL_ + (URL_.includes('?') ? '&' : '?') + 'action=list&_=' + Date.now());
    const j = await r.json();
    if (j && j.ok) { rows = j.rows; err = ''; } else err = 'bad';
  } catch (e) { err = String(e); }
  draw();
}
draw(); load(); setInterval(load, 10000);
</script>
</body>
</html>
